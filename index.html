<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="드라이브">
<title>드라이브</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232B54C8'/%3E%3Cpath d='M14 22a4 4 0 0 1 4-4h10l4 5h14a4 4 0 0 1 4 4v15a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&amp;display=swap">
<style>
:root {
  --paper: #ECEFF3;
  --card: #FFFFFF;
  --ink: #17202B;
  --sub: #3E4958;
  --accent: #2B54C8;
  --accent-soft: #DAE3FA;
  --line: #D3D9E1;
  --hover: #F2F4F8;
  --on-accent: #FFFFFF;
  --danger: #B93A2E;
  --ok: #1E7A4C;
  --warn: #A15C00;
  --shade: rgba(15, 21, 30, 0.45);
  --b-pdf: #B93A2E;
  --b-sheet: #1E7A4C;
  --b-doc: #2B54C8;
  --b-slide: #BB5A1D;
  --b-hwp: #16809A;
  --b-zip: #6A57A8;
  --b-media: #8C5896;
  --b-etc: #4E5A6B;
  --font-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F1318;
    --card: #181D24;
    --ink: #E3E8EF;
    --sub: #C3CBD6;
    --accent: #8EA8FF;
    --accent-soft: #233252;
    --line: #2B333E;
    --hover: #1F2630;
    --on-accent: #0F1318;
    --danger: #F0796C;
    --ok: #4FB27F;
    --warn: #E3A450;
    --shade: rgba(0, 0, 0, 0.6);
    --b-pdf: #E3705F;
    --b-sheet: #4FB27F;
    --b-doc: #8EA8FF;
    --b-slide: #E8914F;
    --b-hwp: #52B7CF;
    --b-zip: #A895E4;
    --b-media: #C795D2;
    --b-etc: #A3ADBB;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
svg { flex: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn.danger.fill { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; }
.icon-btn:hover { background: var(--hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 로그인 ---------- */
.auth { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: min(400px, 100%); display: grid; gap: 10px; padding: 26px 22px 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
.auth-card h1 { margin: 0; font: 600 22px/1.3 var(--font-display); display: flex; align-items: center; gap: 10px; }
.auth-sub { margin: 0 0 8px; font-size: 14px; color: var(--sub); }
.auth-card label { margin-top: 4px; font-size: 13px; font-weight: 600; }
.auth-card input { height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); font-size: 16px; }
.auth-card input:focus { outline: none; border-color: var(--accent); }
.auth-err { margin: 2px 0 0; font-size: 13.5px; color: var(--danger); }
.auth-card .btn { height: 46px; margin-top: 8px; font-size: 15px; }

/* ---------- 틀 ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 200px; font: 600 19px/1 var(--font-display); }
.logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); }
.search { flex: 1; min-width: 0; max-width: 640px; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 6px 0 14px; border-radius: 12px; background: var(--paper); border: 1px solid transparent; }
.search:focus-within { background: var(--card); border-color: var(--accent); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: 15px; }
.search input:focus { outline: none; }
.top .spacer { flex: 1; }
.menu-btn { display: none; }

.main { min-height: 0; min-width: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.side { display: flex; flex-direction: column; gap: 4px; padding: 14px 12px; overflow-y: auto; }
.new-btn { justify-content: flex-start; height: 48px; margin-bottom: 10px; padding: 0 18px; border-radius: 14px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.nav { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: transparent; font-size: 14.5px; font-weight: 600; text-align: left; }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--accent-soft); color: var(--accent); }
.usage { margin-top: 18px; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.usage .bar { height: 6px; margin: 8px 0 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.usage .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
.usage.warn .bar i { background: var(--warn); }
.usage.full .bar i { background: var(--danger); }
.usage .mode { margin-top: 8px; font-size: 12.5px; }
.side .help-link { margin-top: auto; }

.content { min-height: 0; margin: 0 14px 14px 0; display: flex; flex-direction: column; border-radius: 16px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.bar-row { display: flex; align-items: center; gap: 8px; min-height: 58px; padding: 8px 12px 8px 18px; border-bottom: 1px solid var(--line); }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { flex: none; height: 34px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; font: 600 17px/1 var(--font-display); white-space: nowrap; }
.crumb:hover { background: var(--hover); }
.crumb.last { cursor: default; }
.crumb.last:hover { background: transparent; }
.sep { flex: none; color: var(--sub); }
.actions { display: flex; align-items: center; gap: 6px; }
.selbar { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.selbar .count { margin-right: 6px; font-weight: 600; }

.list { flex: 1; min-height: 0; overflow-y: auto; }
.thead, .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 150px 96px 44px; align-items: center; }
.thead { position: sticky; top: 0; z-index: 1; height: 40px; background: var(--card); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.thead button { justify-self: start; height: 30px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; font-weight: 600; font-size: 13px; }
.thead button:hover { background: var(--hover); }
.thead .num { justify-self: end; }
.row { min-height: 50px; border-bottom: 1px solid var(--line); font-size: 14px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row .ck, .thead .ck { display: grid; place-items: center; }
.ck input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
.name { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 0; border: 0; background: transparent; text-align: left; }
.name .t { min-width: 0; display: flex; flex-direction: column; }
.name .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.name .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--sub); }
.cell { padding-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sub); font-size: 13.5px; }
.cell.num { text-align: right; padding-right: 4px; }
.badge { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: #fff; font: 700 9.5px/1 var(--font-body); letter-spacing: .02em; }
.folder-ico { display: grid; place-items: center; width: 34px; height: 34px; }
.claude-tag { flex: none; padding: 1px 7px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; }
.namewrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mobile-meta { display: none; }
.empty { display: grid; place-items: center; gap: 10px; padding: 70px 20px; text-align: center; color: var(--sub); }
.empty b { color: var(--ink); font-size: 16px; }
.loading { padding: 40px; text-align: center; color: var(--sub); }
.list-note { padding: 10px 18px; font-size: 13px; color: var(--sub); border-bottom: 1px solid var(--line); }

/* ---------- 메뉴·창 ---------- */
.pop { position: fixed; z-index: 30; min-width: 200px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.pop button { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 14px; }
.pop button:hover { background: var(--hover); }
.pop button.danger { color: var(--danger); }
.pop hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--line); }
dialog { width: min(440px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: var(--shade); }
.dlg { display: grid; gap: 12px; padding: 22px; }
.dlg h2 { margin: 0; font: 600 18px/1.35 var(--font-display); }
.dlg p { margin: 0; font-size: 14.5px; }
.dlg input[type=text], .dlg input[type=password] { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 15px; }
.dlg input[type=text]:focus, .dlg input[type=password]:focus { outline: none; border-color: var(--accent); }
.dlg .btns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.dlg .err { color: var(--danger); font-size: 13.5px; }
.picker { max-height: 46vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
.picker .crumbs { padding: 6px; border-bottom: 1px solid var(--line); }
.picker .crumb { font-size: 14px; height: 30px; }
.pick { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
.pick:hover { background: var(--hover); }
.pick:disabled { opacity: .45; cursor: default; }
.help ol { margin: 0; padding-left: 20px; font-size: 14.5px; display: grid; gap: 6px; }
.help code { padding: 1px 5px; border-radius: 5px; background: var(--paper); font-size: 13px; }
.urlrow { display: flex; gap: 8px; }
.urlrow input { flex: 1; min-width: 0; }
.dlg input.mono { font: 13px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.dlg .warn { color: var(--danger); font-size: 13.5px; }
.dlg .btns .left { margin-right: auto; }

/* ---------- 올리기 창 ---------- */
.uploads { position: fixed; right: 18px; bottom: 18px; z-index: 20; width: min(380px, calc(100% - 24px)); border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 12px 34px rgba(0,0,0,.2); overflow: hidden; }
.up-head { display: flex; align-items: center; gap: 6px; padding: 10px 8px 10px 16px; background: var(--ink); color: var(--card); }
.up-head b { flex: 1; font-size: 14px; }
.up-head .icon-btn { width: 32px; height: 32px; color: var(--card); }
.up-head .icon-btn:hover { background: rgba(255,255,255,.12); }
.up-list { max-height: 300px; overflow-y: auto; }
.up-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 9px 10px 9px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.up-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up-row .s { grid-column: 1; font-size: 12.5px; color: var(--sub); }
.up-row .s.bad { color: var(--danger); }
.up-row .s.good { color: var(--ok); }
.up-row .pb { grid-column: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.up-row .pb i { display: block; height: 100%; width: 0; background: var(--accent); }
.up-row .icon-btn { grid-row: 1 / span 3; grid-column: 2; width: 30px; height: 30px; }

.drop { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(43, 84, 200, .12); border: 3px dashed var(--accent); pointer-events: none; }
.drop div { padding: 16px 22px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 16px; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--card); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast.bad { background: var(--danger); color: #fff; }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
.fab { display: none; }

/* ---------- 휴대폰 ---------- */
@media (max-width: 760px) {
  .brand { min-width: 0; }
  .brand span { display: none; }
  .menu-btn { display: inline-grid; }
  .top { gap: 6px; padding-left: 8px; padding-right: 8px; }
  .top .spacer { display: none; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; z-index: 25; width: 270px; padding-top: max(14px, env(safe-area-inset-top)); background: var(--card); box-shadow: 6px 0 30px rgba(0,0,0,.25); transform: translateX(-105%); transition: transform .18s ease; }
  .side.open { transform: none; }
  .side-shade { position: fixed; inset: 0; z-index: 24; background: var(--shade); }
  .content { margin: 0; border-radius: 0; border: 0; }
  .bar-row { padding-left: 10px; }
  .thead { display: none; }
  .row { grid-template-columns: 40px minmax(0, 1fr) 40px; min-height: 60px; }
  .row .cell { display: none; }
  .mobile-meta { display: block; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions .wide { display: none; }
  .fab { position: fixed; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 15; display: grid; place-items: center; width: 58px; height: 58px; border: 0; border-radius: 18px; background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .uploads { right: 12px; bottom: 86px; }
}
</style>
</head>
<body>

<div class="auth" id="auth" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <h1><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M3 7a2 2 0 0 1 2-2h4.6l2 2.4H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>드라이브</h1>
    <p class="auth-sub">나에게 보내기와 같은 계정으로 로그인해 주세요.</p>
    <label for="authEmail">이메일</label>
    <input id="authEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
    <label for="authPw">비밀번호</label>
    <input id="authPw" type="password" autocomplete="current-password">
    <p class="auth-err" id="authErr" hidden></p>
    <button type="submit" class="btn primary" id="authBtn">로그인</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M3 7a2 2 0 0 1 2-2h4.6l2 2.4H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span>드라이브</span></div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="드라이브에서 검색" autocomplete="off" enterkeyhint="search">
      <button class="icon-btn" id="qClear" aria-label="검색 지우기" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </label>
    <div class="spacer"></div>
    <button class="icon-btn" id="moreBtn" aria-label="더 보기"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>

  <div class="main">
    <nav class="side" id="side">
      <button class="btn new-btn" id="newBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새로 만들기</button>
      <button class="nav" data-nav="root"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4.6l2 2.4H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>내 드라이브</button>
      <button class="nav" data-nav="recent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>최근</button>
      <button class="nav" data-nav="trash"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>휴지통</button>
      <div class="usage" id="usage">
        <div id="usageText">저장공간 확인 중</div>
        <div class="bar"><i id="usageBar"></i></div>
        <div id="usageSub"></div>
        <div class="mode" id="modeText" hidden></div>
      </div>
      <button class="nav help-link" id="helpBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.6M12 17.5v.01"/></svg>Claude와 같이 쓰기</button>
    </nav>
    <div class="side-shade" id="sideShade" hidden></div>

    <section class="content" id="content">
      <div class="bar-row">
        <div class="crumbs" id="crumbs"></div>
        <div class="selbar" id="selbar" hidden></div>
        <div class="actions" id="actions"></div>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>
  <button class="fab" id="fab" aria-label="올리기·새 폴더"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="uploads" id="uploads" hidden>

function sortedItems() {
  const k = S.sort.key, d = S.sort.dir;
  const arr = S.items.slice();
  if (S.view === 'recent' && k === 'name' && d === 1) return arr;
  if (S.view === 'search' && k === 'name' && d === 1) return arr.sort((a, b) => (a.folder === b.folder ? 0 : a.folder ? -1 : 1));
  arr.sort((a, b) => {
    if (S.view !== 'trash' && a.folder !== b.folder) return a.folder ? -1 : 1;
    let r = 0;
    if (k === 'name') r = collator.compare(a.name, b.name);
    else if (k === 'date') r = new Date(S.view === 'trash' ? a.trashed : a.updated) - new Date(S.view === 'trash' ? b.trashed : b.updated);
    else if (k === 'size') r = (a.folder ? -1 : (S.view === 'trash' ? a.total : a.size)) - (b.folder ? -1 : (S.view === 'trash' ? b.total : b.size));
    return r * d || collator.compare(a.name, b.name);
  });
  return arr;
}

/* ---------- 내려받기 ---------- */
async function ensureProbe() {
  if (S.direct !== null) return S.direct;
  if (!S.probe) {
    S.probe = (async () => {
      try {
        const r = await api('/probe');
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 6000);
        const res = await fetch(r.url, { signal: ctl.signal, cache: 'no-store' });
        clearTimeout(timer);
        S.direct = res.ok;
      } catch (e) {
        if (e && e.code === 'NOT_CONFIGURED') { S.probe = null; throw e; }
        S.direct = false;
      }
      showMode();
      return S.direct;
    })();
  }
  return S.probe;
}
function showMode() {
  const m = $('#modeText');
  if (S.direct === false) {
    m.hidden = false;
    m.textContent = '저장소에 바로 연결되지 않아 Supabase를 거쳐 주고받는 중이에요 (올리기는 파일당 45MB까지).';
  } else m.hidden = true;
}
async function download(it, inline) {
  const w = inline ? window.open('about:blank', '_blank') : null;
  try {
    const direct = await ensureProbe();
    const r = await api('/download', { id: it.id, inline: !!inline });
    const url = direct ? r.url : r.proxy_url;
    if (w) { w.location.href = url; return; }
    const f = el('iframe');
    f.hidden = true;
    f.src = url;
    document.body.append(f);
    setTimeout(() => f.remove(), 60000);
  } catch (e) {
    if (w) w.close();
    fail(e);
  }
}

const Q = { jobs: [], running: 0, folderCache: new Map() };

function nfc(s) { try { return s.normalize('NFC'); } catch (_) { return s; } }
async function collectDrop(dt) {
  const out = [], dirs = new Set();
  const items = Array.from(dt.items || []).filter((i) => i.kind === 'file');
  const entries = items.map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));
  if (!entries.some(Boolean)) {
    for (const f of Array.from(dt.files || [])) out.push({ file: f, dir: '' });
    return { files: out, dirs: [] };
  }
  async function walk(entry, dir) {
    if (entry.isFile) {
      const f = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ file: f, dir });
    } else if (entry.isDirectory) {
      const sub = dir ? dir + '/' + entry.name : entry.name;
      dirs.add(sub);
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        for (const e of batch) await walk(e, sub);
      }
    }
  }
  for (const e of entries) if (e) await walk(e, '');
  return { files: out, dirs: Array.from(dirs) };
}
function fromInput(list) {
  const files = [], dirs = new Set();
  for (const f of Array.from(list)) {
    const rel = f.webkitRelativePath || '';
    const dir = rel ? rel.slice(0, rel.lastIndexOf('/')) : '';
    if (dir) { const parts = dir.split('/'); for (let i = 1; i <= parts.length; i++) dirs.add(parts.slice(0, i).join('/')); }
    files.push({ file: f, dir });
  }
  return { files, dirs: Array.from(dirs) };
}
async function startUpload(batch) {
  if (S.view !== 'folder') { toast('내 드라이브의 폴더 화면에서 올려 주세요.'); return; }
  const files = batch.files.filter((x) => x.file && x.file.name && !/^(\.DS_Store|Thumbs\.db|desktop\.ini)$/i.test(x.file.name));
  if (!files.length && !batch.dirs.length) return;
  const parent = S.folder;
  const parentLabel = S.crumbs.length ? S.crumbs[S.crumbs.length - 1].name : '내 드라이브';
  // 같은 이름 확인 (현재 폴더 바로 아래만)
  const names = new Map(S.items.map((i) => [nfc(i.name).toLowerCase(), i]));
  const clashFiles = files.filter((x) => !x.dir && names.has(nfc(x.file.name).toLowerCase()) && !names.get(nfc(x.file.name).toLowerCase()).folder);
  const clashFolderFile = files.filter((x) => !x.dir && names.has(nfc(x.file.name).toLowerCase()) && names.get(nfc(x.file.name).toLowerCase()).folder);
  const tops = new Set(batch.dirs.map((d) => nfc(d.split('/')[0]).toLowerCase()));
  const mergeFolders = Array.from(tops).filter((t) => names.has(t) && names.get(t).folder);
  let policy = 'rename';
  if (clashFiles.length || mergeFolders.length) {
    const what = clashFiles.length
      ? (clashFiles.length === 1 ? '‘' + clashFiles[0].file.name + '’' : '파일 ' + clashFiles.length + '개') + '와(과) 같은 이름이 이미 있어요.'
      : '같은 이름의 폴더가 있어 그 안에 합쳐서 올려요. 안에 같은 이름 파일이 있으면 어떻게 할까요?';
    const v = await choose('같은 이름이 있어요', what, [
      { label: '건너뛰기', value: 'skip' },
      { label: '둘 다 유지', value: 'rename' },
      { label: '덮어쓰기', value: 'overwrite', cls: 'primary' }
    ]);
    if (!v) return;
    policy = v;
  }
  for (const x of clashFolderFile) toast('‘' + x.file.name + '’은(는) 같은 이름의 폴더가 있어 이름을 바꿔 올려요.');
  Q.folderCache = new Map();
  // 빈 폴더도 만들어 둠
  if (batch.dirs.length) {
    try { for (const d of batch.dirs.sort((a, b) => a.length - b.length)) await folderId(parent, d); }
    catch (e) { fail(e); return; }
  }
  for (const x of files) {
    Q.jobs.push({ file: x.file, dir: x.dir, parent, policy, state: 'wait', loaded: 0, label: parentLabel, row: null, xhr: null, uploadId: null });
  }
  showUploads();
  pump();
}
async function folderId(parent, dir) {
  if (!dir) return parent;
  const key = (parent || '') + '|' + dir;
  if (!Q.folderCache.has(key)) {
    Q.folderCache.set(key, rpc('drive_ensure_folder', { p_parent: parent, p_path: dir }).then((r) => r.id));
  }
  try { return await Q.folderCache.get(key); }
  catch (e) { Q.folderCache.delete(key); throw e; }
}
function pump() {
  while (Q.running < PARALLEL) {
    const job = Q.jobs.find((j) => j.state === 'wait');
    if (!job) break;
    Q.running++;
    job.state = 'run';
    runJob(job).finally(() => { Q.running--; updateUploads(); pump(); if (!Q.running && !Q.jobs.some((j) => j.state === 'wait')) afterBatch(); });
  }
  updateUploads();
}
function afterBatch() {
  loadView(true);
  refreshUsage();
}
function xhrPut(job, url, headers) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    job.xhr = x;
    x.open('PUT', url);
    for (const k in headers) x.setRequestHeader(k, headers[k]);
    x.upload.onprogress = (e) => { if (e.lengthComputable) { job.loaded = e.loaded; drawJob(job); } };
    x.onload = () => { job.xhr = null; if (x.status >= 200 && x.status < 300) resolve(x.status); else reject(Object.assign(new Error('http'), { status: x.status, body: x.responseText })); };
    x.onerror = () => { job.xhr = null; reject(Object.assign(new Error('net'), { status: 0 })); };
    x.onabort = () => { job.xhr = null; reject(Object.assign(new Error('abort'), { aborted: true })); };
    x.send(job.file);
  });
}
async function runJob(job) {
  const f = job.file;
  try {
    const direct = await ensureProbe();
    if (!direct && f.size > PROXY_MAX) throw new AppError('TOO_LARGE_PROXY');
    if (f.size > DIRECT_MAX) throw new AppError('TOO_LARGE');
    const parent = await folderId(job.parent, job.dir);
    if (job.state === 'cancel') return;
    const conflict = job.policy === 'skip' ? 'error' : job.policy;
    let st;
    try {
      st = await api('/upload/start', { parent, name: nfc(f.name), size: f.size, mime: mimeOf(f), conflict });
    } catch (e) {
      if (e.code === 'EXISTS' && job.policy === 'skip') { job.state = 'skip'; return; }
      throw e;
    }
    job.uploadId = st.upload_id;
    if (job.state === 'cancel') { api('/upload/cancel', { upload_id: st.upload_id }).catch(() => {}); return; }
    const type = mimeOf(f);
    let usedProxy = !S.direct;
    if (!usedProxy) {
      try { await xhrPut(job, st.put_url, { 'Content-Type': type }); }
      catch (e) {
        if (e.aborted) throw e;
        if (e.status === 0 && f.size <= PROXY_MAX) { S.direct = false; showMode(); usedProxy = true; job.loaded = 0; }
        else throw new AppError(e.status === 0 ? 'NET' : 'SERVER', 'R2 ' + e.status);
      }
    }
    if (usedProxy) {
      try { await xhrPut(job, st.proxy_url, { 'Content-Type': type, Authorization: 'Bearer ' + (await token()), apikey: CFG.key }); }
      catch (e) {
        if (e.aborted) throw e;
        let j = null;
        try { j = JSON.parse(e.body || ''); } catch (_) { /* 무시 */ }
        throw e.status ? parseErr(e.status, j) : new AppError('NET');
      }
    }
    const fin = await api('/upload/finish', { upload_id: st.upload_id });
    job.state = 'done';
    job.result = fin.item;
  } catch (e) {
    if (e && e.aborted) { job.state = 'cancel'; if (job.uploadId) api('/upload/cancel', { upload_id: job.uploadId }).catch(() => {}); return; }
    job.state = 'fail';
    job.error = e && e.code === 'TOO_LARGE_PROXY' ? '회사망 모드에서는 45MB까지만 올릴 수 있어요' : errText(e);
    if (job.uploadId) api('/upload/cancel', { upload_id: job.uploadId }).catch(() => {});
    if (e && e.code === 'QUOTA') Q.jobs.forEach((j) => { if (j.state === 'wait') { j.state = 'fail'; j.error = MSG.QUOTA; } });
  }
}
function showUploads() { $('#uploads').hidden = false; $('#upList').hidden = false; updateUploads(); }
function drawJob(job) {
  if (!job.row) return;
  const r = job.row;
  const s = r.querySelector('.s'), bar = r.querySelector('.pb i'), btn = r.querySelector('.icon-btn');
  const pct = job.file.size ? Math.round((job.loaded / job.file.size) * 100) : 100;
  s.className = 's';
  if (job.state === 'wait') s.textContent = '기다리는 중 · ' + fmtSize(job.file.size);
  else if (job.state === 'run') s.textContent = pct + '% · ' + fmtSize(job.file.size);
  else if (job.state === 'done') { s.textContent = '완료' + (job.result && job.result.name !== nfc(job.file.name) ? ' · ‘' + job.result.name + '’으로 저장' : ''); s.className = 's good'; }
  else if (job.state === 'skip') s.textContent = '같은 이름이 있어 건너뜀';
  else if (job.state === 'cancel') s.textContent = '취소함';
  else if (job.state === 'fail') { s.textContent = job.error || '실패'; s.className = 's bad'; }
  bar.style.width = (job.state === 'done' ? 100 : job.state === 'run' ? pct : 0) + '%';
  r.querySelector('.pb').hidden = job.state !== 'run';
  btn.hidden = !(job.state === 'wait' || job.state === 'run');
}
function updateUploads() {
  const list = $('#upList');
  for (const job of Q.jobs) {
    if (!job.row) {
      const r = el('div', 'up-row');
      r.append(el('span', 'n', (job.dir ? job.dir + '/' : '') + job.file.name), el('span', 's'));
      const pb = el('div', 'pb');
      pb.append(el('i'));
      r.append(pb);
      const x = el('button', 'icon-btn');
      x.setAttribute('aria-label', '취소');
      x.append(svg(ICON.close, 16));
      x.onclick = () => { if (job.state === 'wait') { job.state = 'cancel'; drawJob(job); updateUploads(); } else if (job.xhr) job.xhr.abort(); else job.state = 'cancel'; };
      r.append(x);
      job.row = r;
      list.append(r);
    }
    drawJob(job);
  }
  const total = Q.jobs.length, done = Q.jobs.filter((j) => j.state === 'done').length;
  const active = Q.jobs.filter((j) => j.state === 'wait' || j.state === 'run').length;
  const failed = Q.jobs.filter((j) => j.state === 'fail').length;
  $('#upTitle').textContent = active ? '올리는 중 ' + done + '/' + total : (failed ? '올리기 끝 · 실패 ' + failed + '개' : '올리기 완료 ' + done + '개');
}
function clearUploads() {
  if (Q.jobs.some((j) => j.state === 'wait' || j.state === 'run')) { toast('올리는 중인 파일이 있어요.'); return; }
  Q.jobs = [];
  $('#upList').replaceChildren();
  $('#uploads').hidden = true;
}

/* ---------- 끌어다 놓기 ---------- */
let dragDepth = 0;
function isFileDrag(e) { return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'); }
window.addEventListener('dragenter', (e) => {
  if (!isFileDrag(e) || $('#app').hidden) return;
  e.preventDefault();
  dragDepth++;
  const where = S.view === 'folder' ? (S.crumbs.length ? '‘' + S.crumbs[S.crumbs.length - 1].name + '’' : '내 드라이브') : null;
  $('#dropText').textContent = where ? where + '에 올려요' : '내 드라이브의 폴더 화면에서 놓아 주세요';
  $('#drop').hidden = false;
});
window.addEventListener('dragover', (e) => { if (isFileDrag(e)) e.preventDefault(); });
window.addEventListener('dragleave', (e) => { if (!isFileDrag(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').hidden = true; });
window.addEventListener('drop', async (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('#drop').hidden = true;
  if ($('#app').hidden) return;
  try { startUpload(await collectDrop(e.dataTransfer)); } catch (err) { fail(err); }
});

/* ---------- 도움말 ---------- */
function help() {
  dialog((box, finish) => {
    box.classList.add('help');
    box.append(el('h2', null, 'Claude와 같이 쓰기'));
    const ol = el('ol');
    const li = (parts) => { const l = el('li'); for (const p of parts) l.append(typeof p === 'string' ? document.createTextNode(p) : p); ol.append(l); };
    li(['Claude 대화에서 ', el('code', null, '드라이브'), '라고 말하면 여기 파일을 찾아 읽어요. 예: “드라이브에서 롯데카드 v25 엑셀 찾아서 검토해줘”']);
    li(['Claude가 만든 결과물은 따로 말하지 않으면 ', el('code', null, 'Claude'), ' 폴더에 저장되고, 이름 옆에 Claude 표시가 붙어요.']);
    li(['Claude는 파일을 휴지통으로만 옮길 수 있고, 영구 삭제는 여기 화면에서만 돼요.']);
    li(['처음 한 번은 Claude에 이 드라이브를 커넥터로 등록해야 해요. 아래 연결 주소 보기에서 주소를 복사해 넣으면 돼요. 이 주소는 비밀번호와 같으니 남에게 보내지 마세요.']);
    box.append(ol);
    buttons(box, [{ label: '연결 주소 보기', onClick: () => { finish(true); setTimeout(connectorDialog, 0); } }, { label: '닫기', cls: 'primary', submit: true }]);
    box.onsubmit = (e) => { e.preventDefault(); finish(true); };
  });
}

/* ---------- Claude 연결 주소 ---------- */
async function connectorDialog() {
  let token;
  try { token = await rpc('drive_connector_token'); } catch (e) { fail(e); return; }
  dialog((box, finish) => {
    box.classList.add('help');
    box.append(el('h2', null, 'Claude 연결 주소'));
    box.append(el('p', null, '이 주소를 Claude에 커넥터로 한 번 등록하면, Claude가 이 드라이브의 파일을 읽고 결과물을 저장할 수 있어요.'));
    const row = el('div', 'urlrow');
    const out = el('input', 'mono');
    out.type = 'text'; out.readOnly = true; out.spellcheck = false; out.setAttribute('aria-label', '연결 주소');
    out.addEventListener('focus', () => out.select());
    const copy = el('button', 'btn primary', '복사');
    copy.type = 'button';
    row.append(out, copy);
    const none = el('p', null, '아직 만든 주소가 없어요. 주소 만들기를 눌러 주세요.');
    const steps = el('ol');
    for (const t of ['claude.ai에서 Customize → Connectors로 들어가요.', 'Add → Custom → Web을 골라요.', '이름은 드라이브, 주소 칸에 위 주소를 붙여 넣고 Continue를 눌러요.']) steps.append(el('li', null, t));
    const secret = el('p', 'warn', '주소가 곧 비밀번호예요. 메일·메신저로 남에게 보내지 마세요.');
    const warn = el('p', 'warn', '새 주소를 만들면 지금 주소는 1분 안에 막혀요. Claude에 등록한 커넥터 주소도 새 주소로 바꿔야 해요.');
    warn.hidden = true;
    const err = el('div', 'err');
    err.hidden = true;
    box.append(row, none, steps, secret, warn, err);
    const btnRow = buttons(box, [{ label: '' }, { label: '닫기', submit: true }]);
    const make = btnRow.firstChild;
    let armed = false;
    const show = (t) => {
      token = t;
      row.hidden = !t; steps.hidden = !t; secret.hidden = !t; none.hidden = !!t;
      out.value = t ? CFG.url + '/functions/v1/drive/mcp/' + t : '';
      armed = false; warn.hidden = true;
      make.textContent = t ? '새 주소로 바꾸기' : '주소 만들기';
      make.className = 'btn ' + (t ? 'danger left' : 'primary');
    };
    copy.onclick = async () => {
      let ok = false;
      try { await navigator.clipboard.writeText(out.value); ok = true; } catch (_) {
        out.focus(); out.select();
        try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      }
      copy.textContent = ok ? '복사됨' : '길게 눌러 복사';
      setTimeout(() => { copy.textContent = '복사'; }, 2500);
    };
    make.onclick = async () => {
      err.hidden = true;
      if (token && !armed) { armed = true; warn.hidden = false; make.textContent = '바꾸기 확인'; make.className = 'btn danger fill left'; return; }
      make.disabled = true;
      try {
        show(await rpc('drive_new_connector_token'));
        toast('새 연결 주소를 만들었어요. 복사해서 Claude 커넥터에 넣어 주세요.');
      } catch (ex) { err.hidden = false; err.textContent = errText(ex); }
      make.disabled = false;
    };
    box.onsubmit = (e) => { e.preventDefault(); finish(true); };
    show(token);
  });
}

/* ---------- 사이드 메뉴(휴대폰) ---------- */
function openSide() { $('#side').classList.add('open'); $('#sideShade').hidden = false; }
function closeSide() { $('#side').classList.remove('open'); $('#sideShade').hidden = true; }

/* ---------- 시작 ---------- */
let started = false;
function start() {
  $('#auth').hidden = true;
  $('#app').hidden = false;
  if (!started) {
    started = true;
    window.addEventListener('hashchange', route);
  }
  route();
  refreshUsage();
  ensureProbe().catch(() => {});
}
function wire() {
  $('#authForm').addEventListener('submit', onLogin);
  document.querySelectorAll('.nav[data-nav]').forEach((n) => n.addEventListener('click', () => go(n.dataset.nav === 'root' ? '#/' : '#/' + n.dataset.nav)));
  $('#newBtn').addEventListener('click', (e) => { e.stopPropagation(); if (S.view !== 'folder') go('#/'); uploadMenu($('#newBtn')); });
  $('#fab').addEventListener('click', (e) => { e.stopPropagation(); if (S.view !== 'folder') { go('#/'); return; } uploadMenu($('#fab')); });
  $('#helpBtn').addEventListener('click', () => { closeSide(); help(); });
  $('#menuBtn').addEventListener('click', openSide);
  $('#sideShade').addEventListener('click', closeSide);
  $('#moreBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    popMenu($('#moreBtn'), [
      { label: '새로 고침', icon: 'refresh', run: () => { loadView(); refreshUsage(); } },
      { label: 'Claude와 같이 쓰기', icon: 'open', run: help },
      { label: 'Claude 연결 주소', icon: 'link', run: connectorDialog },
      { label: '저장소 키 넣기', icon: 'rename', run: () => keysDialog(false) },
      '-',
      { label: '로그아웃' + (session && session.email ? ' (' + session.email + ')' : ''), icon: 'logout', run: logout }
    ]);
  });
  let qt = null;
  $('#q').addEventListener('input', () => {
    const v = $('#q').value.trim();
    $('#qClear').hidden = !v;
    clearTimeout(qt);
    qt = setTimeout(() => { if (v) go('#/search/' + encodeURIComponent(v)); else if (S.view === 'search') history.back(); }, 350);
  });
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#q').value = ''; $('#qClear').hidden = true; if (S.view === 'search') go('#/'); } });
  $('#qClear').addEventListener('click', (e) => { e.preventDefault(); $('#q').value = ''; $('#qClear').hidden = true; go('#/'); });
  $('#pickFiles').addEventListener('change', (e) => { startUpload(fromInput(e.target.files)); e.target.value = ''; });
  $('#pickFolder').addEventListener('change', (e) => { startUpload(fromInput(e.target.files)); e.target.value = ''; });
  $('#upClose').addEventListener('click', clearUploads);
  $('#upToggle').addEventListener('click', () => { const l = $('#upList'); l.hidden = !l.hidden; $('#upToggle').style.transform = l.hidden ? 'rotate(180deg)' : ''; });
  window.addEventListener('beforeunload', (e) => { if (Q.jobs.some((j) => j.state === 'wait' || j.state === 'run')) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if ($('#dlg').open) return;
    if (e.key === 'Delete' && S.sel.size && S.view !== 'trash') trashItems(selectedItems());
    if (e.key === 'Escape' && S.sel.size) { S.sel.clear(); render(); }
  });
}
wire();
if (session) start(); else showAuth();
</script>
